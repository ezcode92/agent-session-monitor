[project]
name = "agent-session-monitor"
version = "0.1.0"
description = "Local dashboard for coding-agent session logs"
requires-python = ">=3.12"
dependencies = ["streamlit>=1.63", "plotly>=6.0", "pandas>=2.2", "tzlocal>=5.2", "tzdata>=2025.1"]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
