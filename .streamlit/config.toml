[server]
address = "127.0.0.1"
port = 8501

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"

[ui]
hideTopBar = false

# Native widgets and Plotly share this palette. Keep the base unset so system
# light/dark preference and the viewer's theme selection both work.
[theme]
font = 'system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif'
codeFont = "ui-monospace, SFMono-Regular, Consolas, monospace"
baseFontSize = 16
baseFontWeight = 400
headingFontSizes = ["2rem", "1.375rem", "1.125rem"]
headingFontWeights = [650, 650, 550]
metricValueFontSize = "2rem"
baseRadius = "0.625rem"
buttonRadius = "0.375rem"
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = true

[theme.light]
primaryColor = "#0f766e"
backgroundColor = "#f7f8fa"
secondaryBackgroundColor = "#ffffff"
textColor = "#3f4b5f"
borderColor = "#7c889b"
linkColor = "#0f766e"
codeBackgroundColor = "#f1f4f8"
dataframeHeaderBackgroundColor = "#f1f4f8"
blueColor = "#175cd3"
blueTextColor = "#175cd3"
blueBackgroundColor = "#eff8ff"
greenColor = "#067647"
greenTextColor = "#067647"
greenBackgroundColor = "#ecfdf3"
orangeColor = "#b54708"
orangeTextColor = "#b54708"
orangeBackgroundColor = "#fffaeb"
redColor = "#b42318"
redTextColor = "#b42318"
redBackgroundColor = "#fef3f2"
chartCategoricalColors = ["#0f766e", "#175cd3", "#b54708", "#8055b5", "#b42318", "#596579"]

[theme.light.sidebar]
backgroundColor = "#f1f4f8"
secondaryBackgroundColor = "#ffffff"

[theme.dark]
primaryColor = "#0f8076"
backgroundColor = "#0f141c"
secondaryBackgroundColor = "#161d27"
textColor = "#c5ced8"
borderColor = "#8795a8"
linkColor = "#7dd3c7"
codeBackgroundColor = "#1e2733"
dataframeHeaderBackgroundColor = "#1e2733"
blueColor = "#84adff"
blueTextColor = "#84adff"
blueBackgroundColor = "#172a46"
greenColor = "#6ce9a6"
greenTextColor = "#6ce9a6"
greenBackgroundColor = "#123527"
orangeColor = "#fec84b"
orangeTextColor = "#fec84b"
orangeBackgroundColor = "#3a2b12"
redColor = "#fda29b"
redTextColor = "#fda29b"
redBackgroundColor = "#3a1d1d"
chartCategoricalColors = ["#5bb8a9", "#84adff", "#fec84b", "#c4a4ee", "#fda29b", "#a7b2c1"]

[theme.dark.sidebar]
backgroundColor = "#161d27"
secondaryBackgroundColor = "#1e2733"
