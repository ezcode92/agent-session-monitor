name: Prepare project logs change
on:
  push:
    branches: ['codex/project-log-improvements']
    paths:
      - '.github/workflows/prepare-project-logs.yml'
permissions:
  contents: write
concurrency:
  group: prepare-project-logs
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/codex/project-log-improvements'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove temporary implementation and generated package metadata
        run: |
          git rm --ignore-unmatch tools/_apply_project_logs.py
          git rm -r --ignore-unmatch src/agent_session_monitor.egg-info
          grep -qxF '*.egg-info/' .gitignore || printf '\n# Generated Python packaging metadata\n*.egg-info/\n' >> .gitignore
          mkdir -p /tmp/project-log-verification
      - name: Install verification dependencies
        run: python -m pip install -e . pytest graphifyy
      - name: Verify complete regression suite
        run: |
          python -m compileall -q src tests
          python -m pytest -q --junitxml=/tmp/project-log-verification/tests.xml
      - name: Verify seven pages across seven viewports and two themes
        env:
          VERIFY_OUTPUT: /tmp/project-log-verification/browser
        run: |
          export BROWSER_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          export PYTHON_BIN="$(command -v python)"
          node tools/verify_ui.mjs
      - name: Rebuild final source knowledge graph without temporary files
        run: graphify update .
      - name: Record verified results and commit only to the work branch
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, os, xml.etree.ElementTree as ET
          suites = ET.parse('/tmp/project-log-verification/tests.xml').getroot()
          total = sum(int(s.get('tests', '0')) for s in suites.findall('testsuite'))
          browser = json.loads(Path('/tmp/project-log-verification/browser/results.json').read_text())
          assert not browser['exceptions']
          with Path('docs/validation.md').open('a', encoding='utf-8') as f:
              f.write(f'\n- 최종 소스 재검증: Python 3.12 테스트 {total}개 통과, Chromium 합성 화면 {len(browser["results"])}개 조합의 단일 H1·가로 넘침·런타임 예외 검사 통과. 실사용 로그가 아닌 tests/browser_app.py를 사용했다.\n')
              f.write('- graphify update . 완료: 코드 AST만 갱신, LLM 호출 없음. 임시 구현 스크립트와 생성된 egg-info는 최종 소스에서 제거했다.\n')
              f.write(f'- 검증 실행: https://github.com/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}\n')
          PY
          test "$GITHUB_REF" = refs/heads/codex/project-log-improvements
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git add .gitignore graphify-out docs/validation.md
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'test: verify 170 regressions and responsive layouts; remove build artifacts'
          git push origin HEAD:refs/heads/codex/project-log-improvements
      - name: Archive source and verification output
        if: always()
        run: |
          tar --exclude=.git --exclude=.venv --exclude=.agent-monitor --exclude=__pycache__ --exclude='*.egg-info' -czf /tmp/project-log-verification/source.tar.gz .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: project-log-final-verification
          path: /tmp/project-log-verification
          retention-days: 3
