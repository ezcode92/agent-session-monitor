name: Prepare project logs change
on:
  push:
    branches: ['codex/project-log-improvements']
    paths:
      - 'tools/_apply_project_logs.py'
      - '.github/workflows/prepare-project-logs.yml'
permissions:
  contents: write
concurrency:
  group: prepare-project-logs
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/codex/project-log-improvements'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply reviewed source changes
        run: python tools/_apply_project_logs.py
      - name: Install test dependencies
        run: python -m pip install -e . pytest
      - name: Check syntax and complete regression suite
        run: |
          python -m compileall -q src tests
          git diff --check
          python -m pytest -q --junitxml=/tmp/project-log-tests.xml
      - name: Update knowledge graph using local AST extraction
        id: graph
        continue-on-error: true
        run: |
          python -m pip install graphifyy
          graphify query 'Codex project work log improvement analysis'
          graphify update .
      - name: Record actual test result
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, xml.etree.ElementTree as ET
          suites = ET.parse('/tmp/project-log-tests.xml').getroot()
          total = sum(int(s.get('tests', '0')) for s in suites.findall('testsuite'))
          with Path('docs/validation.md').open('a', encoding='utf-8') as f:
              f.write(f'\n- GitHub Actions Python 3.12 전체 회귀 테스트: {total}개 실행, pytest 종료 코드 0. 실행: https://github.com/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}\n')
          PY
      - name: Commit tested changes to the work branch only
        run: |
          test "$GITHUB_REF" = refs/heads/codex/project-log-improvements
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests docs README.md graphify-out
          git diff --cached --quiet && exit 0
          git commit -m 'feat: Codex-only collectors and evidence-backed project log improvements'
          git push origin HEAD:refs/heads/codex/project-log-improvements
      - name: Archive candidate and verification output
        if: always()
        run: |
          mkdir -p /tmp/project-log-verification
          cp /tmp/project-log-tests.xml /tmp/project-log-verification/ 2>/dev/null || true
          git diff > /tmp/project-log-verification/pending.diff
          tar --exclude=.git --exclude=.venv --exclude=.agent-monitor --exclude=__pycache__ -czf /tmp/project-log-verification/source.tar.gz .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: project-log-verification
          path: /tmp/project-log-verification
          retention-days: 3
